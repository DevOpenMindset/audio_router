name: Build & Release (macOS)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Update pubspec version from tag
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          sed -i '' "s/^version: .*/version: ${VERSION}+1/" pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release

      - name: Create DMG
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          APP="build/macos/Build/Products/Release/AudioRouter.app"
          DMG="AudioRouter-${VERSION}.dmg"

          # Create a temporary directory for the DMG layout
          STAGING="dmg_staging"
          mkdir -p "$STAGING"
          cp -r "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create \
            -volname "AudioRouter ${VERSION}" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "$DMG"

      - name: Extract changelog notes
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then NOTES="Release ${TAG}"; fi
          echo "$NOTES" > release_notes.txt

      - name: Upload DMG to release
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          DMG="AudioRouter-${VERSION}.dmg"
          NOTES=$(cat release_notes.txt)
          RELEASE_REPO="DevOpenMindset/audio_router_releases"

          if [ -n "${{ secrets.RELEASES_TOKEN }}" ]; then
            export GH_TOKEN="${{ secrets.RELEASES_TOKEN }}"
            if gh release view "$TAG" --repo "$RELEASE_REPO" &>/dev/null; then
              gh release upload "$TAG" "$DMG" --repo "$RELEASE_REPO" --clobber
              gh release edit "$TAG" --repo "$RELEASE_REPO" --notes "$NOTES" || true
            else
              gh release create "$TAG" "$DMG" \
                --repo "$RELEASE_REPO" \
                --title "Release $TAG" \
                --notes "$NOTES"
            fi
          else
            export GH_TOKEN="${{ github.token }}"
            if gh release view "$TAG" &>/dev/null; then
              gh release upload "$TAG" "$DMG" --clobber
              gh release edit "$TAG" --notes "$NOTES" || true
            else
              gh release create "$TAG" "$DMG" \
                --title "Release $TAG" \
                --notes "$NOTES"
            fi
          fi
