name: Build & Release (Linux)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            libappindicator3-dev \
            libnotify-dev \
            libsecret-1-dev \
            libjsoncpp-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Update pubspec version from tag
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          sed -i "s/^version: .*/version: ${VERSION}+1/" pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package as tar.gz
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          BUNDLE_DIR="build/linux/x64/release/bundle"

          # Copy .desktop file into bundle
          cp linux/packaging/audio_router.desktop "$BUNDLE_DIR/"

          # Create tarball
          cd build/linux/x64/release
          tar czf "AudioRouter-${VERSION}-linux-x64.tar.gz" bundle/
          mv "AudioRouter-${VERSION}-linux-x64.tar.gz" "$GITHUB_WORKSPACE/"

      - name: Build .deb package
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          BUNDLE_DIR="build/linux/x64/release/bundle"
          DEB_DIR="deb_build/audio-router_${VERSION}_amd64"

          # Create deb directory structure
          mkdir -p "$DEB_DIR/DEBIAN"
          mkdir -p "$DEB_DIR/usr/lib/audio-router"
          mkdir -p "$DEB_DIR/usr/bin"
          mkdir -p "$DEB_DIR/usr/share/applications"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/256x256/apps"

          # Copy bundle (preserves lib/ subdirectory with libaudio_backend.so)
          cp -r "$BUNDLE_DIR/." "$DEB_DIR/usr/lib/audio-router/"
          chmod 755 "$DEB_DIR/usr/lib/audio-router/audio_router"

          # Create launcher wrapper (handles LD_LIBRARY_PATH for bundled .so files)
          printf '#!/bin/sh\nexec /usr/lib/audio-router/audio_router "$@"\n' \
            > "$DEB_DIR/usr/bin/audio-router"
          chmod 755 "$DEB_DIR/usr/bin/audio-router"

          # Copy .desktop file (adjust Exec path)
          sed 's|Exec=audio_router|Exec=/usr/bin/audio-router|' \
            linux/packaging/audio_router.desktop > "$DEB_DIR/usr/share/applications/audio_router.desktop"

          # Copy icon if available
          if [ -f assets/app_icon.png ]; then
            cp assets/app_icon.png "$DEB_DIR/usr/share/icons/hicolor/256x256/apps/audio_router.png"
          fi

          # Create control file (no heredoc indentation issues)
          {
            printf 'Package: audio-router\n'
            printf 'Version: %s\n' "$VERSION"
            printf 'Section: sound\n'
            printf 'Priority: optional\n'
            printf 'Architecture: amd64\n'
            printf 'Depends: libgtk-3-0, libpulse0\n'
            printf 'Recommends: pipewire\n'
            printf 'Maintainer: DevOpenMindset <contact@devopenm.com>\n'
            printf 'Description: Per-app audio routing for Linux\n'
            printf ' Route individual application audio to different output devices.\n'
            printf ' Supports PipeWire (primary) and PulseAudio (fallback).\n'
          } > "$DEB_DIR/DEBIAN/control"
          chmod 644 "$DEB_DIR/DEBIAN/control"

          # Build deb
          dpkg-deb --build --root-owner-group "$DEB_DIR"
          mv "deb_build/audio-router_${VERSION}_amd64.deb" "$GITHUB_WORKSPACE/"

      - name: Build AppImage
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          BUNDLE_DIR="build/linux/x64/release/bundle"

          # Download appimagetool
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool

          # Create AppDir
          APPDIR="AudioRouter.AppDir"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/lib"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          # Copy bundle
          cp -r "$BUNDLE_DIR"/* "$APPDIR/usr/bin/"

          # Copy .desktop to root of AppDir
          sed 's|Exec=audio_router|Exec=AppRun|' \
            linux/packaging/audio_router.desktop > "$APPDIR/audio_router.desktop"

          # Copy icon
          if [ -f assets/app_icon.png ]; then
            cp assets/app_icon.png "$APPDIR/audio_router.png"
            cp assets/app_icon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/audio_router.png"
          else
            # Create a placeholder icon
            convert -size 256x256 xc:'#3584E4' "$APPDIR/audio_router.png" 2>/dev/null || true
          fi

          # Create AppRun script
          cat > "$APPDIR/AppRun" << 'APPRUN'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export LD_LIBRARY_PATH="${HERE}/usr/bin/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/audio_router" "$@"
          APPRUN
          sed -i 's/^          //' "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          # Build AppImage
          ARCH=x86_64 ./appimagetool "$APPDIR" "AudioRouter-${VERSION}-x86_64.AppImage" || true

      - name: Extract changelog notes
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG}"
          fi
          echo "$NOTES" > release_notes.txt

      - name: Upload artifacts to release
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          NOTES=$(cat release_notes.txt)
          RELEASE_REPO="DevOpenMindset/audio_router_releases"

          FILES=""
          [ -f "AudioRouter-${VERSION}-linux-x64.tar.gz" ] && FILES="$FILES AudioRouter-${VERSION}-linux-x64.tar.gz"
          [ -f "audio-router_${VERSION}_amd64.deb" ] && FILES="$FILES audio-router_${VERSION}_amd64.deb"
          [ -f "AudioRouter-${VERSION}-x86_64.AppImage" ] && FILES="$FILES AudioRouter-${VERSION}-x86_64.AppImage"

          if [ -n "${{ secrets.RELEASES_TOKEN }}" ]; then
            export GH_TOKEN="${{ secrets.RELEASES_TOKEN }}"
            if gh release view "$TAG" --repo "$RELEASE_REPO" &>/dev/null; then
              gh release upload "$TAG" $FILES --repo "$RELEASE_REPO" --clobber
              gh release edit "$TAG" --repo "$RELEASE_REPO" --notes "$NOTES" || true
            else
              gh release create "$TAG" $FILES \
                --repo "$RELEASE_REPO" \
                --title "Release $TAG" \
                --notes "$NOTES"
            fi
          else
            export GH_TOKEN="${{ github.token }}"
            if gh release view "$TAG" &>/dev/null; then
              gh release upload "$TAG" $FILES --clobber
            else
              gh release create "$TAG" $FILES \
                --title "Release $TAG" \
                --notes "$NOTES"
            fi
          fi
