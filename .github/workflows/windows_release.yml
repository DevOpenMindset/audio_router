name: Build & Release (Windows)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install InnoSetup
        run: choco install innosetup -y

      - name: Update InnoSetup version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          (Get-Content installer/AudioRouter.iss) -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$version`"" | Set-Content installer/AudioRouter.iss

      - name: Build Installer
        run: iscc installer/AudioRouter.iss

      - name: Extract changelog notes
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          # Extract the section for this version from CHANGELOG.md
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG}"
          fi
          # Write to file to preserve newlines
          echo "$NOTES" > release_notes.txt

      - name: Upload installer to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          EXE="installer/output/AudioRouter-Setup-${VERSION}.exe"
          NOTES=$(cat release_notes.txt)
          if ! gh release upload "$TAG" "$EXE" --repo DevOpenMindset/audio_router_releases --clobber 2>/dev/null; then
            gh release create "$TAG" "$EXE" \
              --repo DevOpenMindset/audio_router_releases \
              --title "Release $TAG" \
              --notes "$NOTES"
          else
            gh release edit "$TAG" \
              --repo DevOpenMindset/audio_router_releases \
              --notes "$NOTES" 2>/dev/null || true
          fi
