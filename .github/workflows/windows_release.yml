name: Build & Release (Windows)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Update pubspec version from tag
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          sed -i "s/^version: .*/version: ${VERSION}+1/" pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install InnoSetup
        run: choco install innosetup -y

      - name: Update InnoSetup version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          (Get-Content installer/AudioRouter.iss) -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$version`"" | Set-Content installer/AudioRouter.iss

      - name: Build Installer
        run: iscc installer/AudioRouter.iss

      - name: Extract changelog notes
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          # Extract the section for this version from CHANGELOG.md
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG}"
          fi
          # Write to file to preserve newlines
          echo "$NOTES" > release_notes.txt

      - name: Upload installer to release
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          EXE="installer/output/AudioRouter-Setup-${VERSION}.exe"
          NOTES=$(cat release_notes.txt)
          RELEASE_REPO="DevOpenMindset/audio_router_releases"

          if [ -n "${{ secrets.RELEASES_TOKEN }}" ]; then
            export GH_TOKEN="${{ secrets.RELEASES_TOKEN }}"
            if gh release view "$TAG" --repo "$RELEASE_REPO" &>/dev/null; then
              gh release upload "$TAG" "$EXE" --repo "$RELEASE_REPO" --clobber
              gh release edit "$TAG" --repo "$RELEASE_REPO" --notes "$NOTES" || true
            else
              gh release create "$TAG" "$EXE" \
                --repo "$RELEASE_REPO" \
                --title "Release $TAG" \
                --notes "$NOTES"
            fi
          else
            # Fallback: publish release on this repo
            export GH_TOKEN="${{ github.token }}"
            if gh release view "$TAG" &>/dev/null; then
              gh release upload "$TAG" "$EXE" --clobber
            else
              gh release create "$TAG" "$EXE" \
                --title "Release $TAG" \
                --notes "$NOTES"
            fi
          fi
