name: Build & Release (Windows)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install InnoSetup
        run: choco install innosetup -y

      - name: Update InnoSetup version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          (Get-Content installer/AudioRouter.iss) -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$version`"" | Set-Content installer/AudioRouter.iss

      - name: Build Installer
        run: iscc installer/AudioRouter.iss

      - name: Upload installer to release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/AudioRouter-Setup-*.exe
