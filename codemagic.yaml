workflows:
  macos-release:
    name: Build & Release (macOS)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      groups:
        - github

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'

    scripts:
      - name: Install dependencies
        script: flutter pub get

      - name: Build macOS release
        script: flutter build macos --release

      - name: Install create-dmg
        script: brew install create-dmg

      - name: Package DMG
        script: |
          VERSION=$(echo $CM_TAG | sed 's/^v//')
          create-dmg \
            --volname "AudioRouter" \
            --no-internet-enable \
            "AudioRouter-${VERSION}.dmg" \
            "build/macos/Build/Products/Release/audio_router.app"

      - name: Upload DMG to GitHub Release
        script: |
          VERSION=$(echo $CM_TAG | sed 's/^v//')
          gh release upload "$CM_TAG" "AudioRouter-${VERSION}.dmg" \
            --repo DevOpenMindset/audio_router \
            --clobber
        
    artifacts:
      - "*.dmg"
