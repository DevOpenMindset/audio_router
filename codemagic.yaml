workflows:
  macos-release:
    name: Build & Release (macOS)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      groups:
        - github

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'

    scripts:
      - name: Update pubspec version from tag
        script: |
          VERSION=$(echo $CM_TAG | sed 's/^v//')
          sed -i '' "s/^version: .*/version: ${VERSION}+1/" pubspec.yaml

      - name: Install dependencies
        script: flutter pub get

      - name: Build native dylib (CoreAudio backend)
        script: |
          cd macos/audio_backend
          bash build.sh

      - name: Build macOS release
        script: flutter build macos --release

      - name: Embed dylib in app bundle
        script: |
          APP="build/macos/Build/Products/Release/soundshift.app"
          cp macos/audio_backend/libaudio_backend.dylib \
             "$APP/Contents/Frameworks/libaudio_backend.dylib"
          # Adding a file after flutter build breaks the app's code seal, and
          # Apple Silicon refuses to launch apps with an invalid signature
          # ("app is damaged"). Re-sign (ad-hoc, same as the Flutter build)
          # after embedding.
          codesign --force --sign - "$APP/Contents/Frameworks/libaudio_backend.dylib"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Package DMG (hdiutil)
        script: |
          VERSION=$(echo $CM_TAG | sed 's/^v//')
          # Create an empty folder to act as the source for the DMG
          mkdir -p "dmg_source"
          
          # Copy the .app into the source folder
          cp -R "build/macos/Build/Products/Release/soundshift.app" "dmg_source/SoundShift.app"
          
          # Create a shortcut to the Applications folder
          ln -s /Applications "dmg_source/Applications"
          
          # Use native macOS hdiutil to create the DMG
          hdiutil create -volname "SoundShift" -srcfolder "dmg_source" -ov -format UDZO "SoundShift-${VERSION}.dmg"

      - name: Upload DMG to GitHub Release
        script: |
          VERSION=$(echo $CM_TAG | sed 's/^v//')
          export GH_TOKEN=$MAC_GH_TOKEN
          # Extract changelog notes for this version
          NOTES=$(awk "/^\#\# \[${VERSION}\]/{found=1; next} found && /^\#\# \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then NOTES="Release $CM_TAG"; fi
          if ! gh release upload "$CM_TAG" "SoundShift-${VERSION}.dmg" --repo DevOpenMindset/audio_router_releases --clobber; then
            echo "Release not found, creating it since Codemagic finished first..."
            gh release create "$CM_TAG" "SoundShift-${VERSION}.dmg" \
              --repo DevOpenMindset/audio_router_releases \
              -t "Release $CM_TAG" \
              --notes "$NOTES"
          else
            gh release edit "$CM_TAG" \
              --repo DevOpenMindset/audio_router_releases \
              --notes "$NOTES" 2>/dev/null || true
          fi
        
    artifacts:
      - "*.dmg"
