workflows:
  macos-release:
    name: Build & Release (macOS)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      groups:
        - github

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'

    scripts:
      - name: Install dependencies
        script: flutter pub get

      - name: Build macOS release
        script: flutter build macos --release

      - name: Package DMG (hdiutil)
        script: |
          VERSION=$(echo $CM_TAG | sed 's/^v//')
          # Create an empty folder to act as the source for the DMG
          mkdir -p "dmg_source"
          
          # Copy the .app into the source folder
          cp -R "build/macos/Build/Products/Release/audio_router.app" "dmg_source/"
          
          # Create a shortcut to the Applications folder
          ln -s /Applications "dmg_source/Applications"
          
          # Use native macOS hdiutil to create the DMG
          hdiutil create -volname "AudioRouter" -srcfolder "dmg_source" -ov -format UDZO "AudioRouter-${VERSION}.dmg"

      - name: Upload DMG to GitHub Release
        script: |
          VERSION=$(echo $CM_TAG | sed 's/^v//')
          gh release upload "$CM_TAG" "AudioRouter-${VERSION}.dmg" \
            --repo DevOpenMindset/audio_router \
            --clobber
        
    artifacts:
      - "*.dmg"
